<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Snake Game</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    #score-board {
      font-size: 24px;
      margin-bottom: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    canvas {
      background-color: #000000;
      border: 3px solid #333333;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    #game-over-text {
      margin-top: 15px;
      font-size: 16px;
      color: #888888;
    }
  </style>
</head>
<body>

  <div id="score-board">Score: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="game-over-text">Use Arrow Keys to move. Press Space to restart on Game Over.</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let velocityX = 0;
    let velocityY = 0;
    let foodX = 15;
    let foodY = 15;
    let score = 0;
    let gameOver = false;
    let gameLoop;

    function startGame() {
      snake = [{ x: 10, y: 10 }];
      velocityX = 0;
      velocityY = 0;
      score = 0;
      scoreElement.innerText = score;
      gameOver = false;
      placeFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(drawGame, 100);
    }

    function placeFood() {
      foodX = Math.floor(Math.random() * tileCount);
      foodY = Math.floor(Math.random() * tileCount);

      // Prevent food from spawning on top of the snake body
      for (let segment of snake) {
        if (segment.x === foodX && segment.y === foodY) {
          placeFood();
          break;
        }
      }
    }

    function drawGame() {
      if (gameOver) return;

      // Update position
      const head = { x: snake[0].x + velocityX, y: snake[0].y + velocityY };

      // Wall collision check
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame();
        return;
      }

      // Self-collision check (only if moving)
      if (velocityX !== 0 || velocityY !== 0) {
        for (let segment of snake) {
          if (head.x === segment.x && head.y === segment.y) {
            endGame();
            return;
          }
        }
        snake.unshift(head);

        // Food collision
        if (head.x === foodX && head.y === foodY) {
          score += 10;
          scoreElement.innerText = score;
          placeFood();
        } else {
          snake.pop();
        }
      }

      // Clear canvas
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw food
      ctx.fillStyle = "#ff4757";
      ctx.fillRect(foodX * gridSize, foodY * gridSize, gridSize - 2, gridSize - 2);

      // Draw snake
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#2ed573" : "#1e90ff";
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
      });
    }

    function endGame() {
      gameOver = true;
      clearInterval(gameLoop);

      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 28px Arial";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);

      ctx.font = "16px Arial";
      ctx.fillText("Press Space to Play Again", canvas.width / 2, canvas.height / 2 + 25);
    }

    window.addEventListener("keydown", (e) => {
      // Prevent scrolling via arrow keys

                        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
      }

      switch (e.key) {
        case "ArrowUp":
          if (velocityY !== 1) {
            velocityX = 0;
            velocityY = -1;
          }
          break;
        case "ArrowDown":
          if (velocityY !== -1) {
            velocityX = 0;
            velocityY = 1;
          }
          break;
        case "ArrowLeft":
          if (velocityX !== 1) {
            velocityX = -1;
            velocityY = 0;
          }
          break;
        case "ArrowRight":
          if (velocityX !== -1) {
            velocityX = 1;
            velocityY = 0;
          }
          break;
        case " ":
          if (gameOver) startGame();
          break;
      }
    });

    startGame();
  </script>
</body>
</html>
